<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demir'in sitesi</title>
    <style>
      :root {
        --bg-a: #f7fbff;
        --bg-b: #e9f2ff;
        --card-bg: rgba(255, 255, 255, 0.72);
        --card-border: rgba(255, 255, 255, 0.7);
        --text: #0f172a;
        --muted: #334155;
        --accent: #0ea5e9;
        --accent-hover: #0284c7;
        --shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", "Poppins", sans-serif;
        color: var(--text);
        background: radial-gradient(
          circle at top left,
          #ffffff 0%,
          var(--bg-a) 35%,
          var(--bg-b) 100%
        );
      }

      section {
        width: min(520px, 100%);
        padding: 40px 32px;
        border-radius: 20px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 2.5rem);
        letter-spacing: -0.03em;
      }

      h2 {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: clamp(1.2rem, 2.4vw, 1.5rem);
        font-weight: 600;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--accent-hover) 100%
        );
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          filter 0.2s ease;
        box-shadow: 0 10px 24px rgba(14, 165, 233, 0.35);
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.03);
        box-shadow: 0 12px 26px rgba(14, 165, 233, 0.45);
      }

      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Merhaba!</h1>
      <h2 id="about-heading">Ben kimim?</h2>
      <button id="toggle-heading" type="button">Başlığı Değiştir</button>
    </section>

    <script>
      const heading = document.getElementById("about-heading");
      const toggleButton = document.getElementById("toggle-heading");
      let isOriginal = true;

      toggleButton.addEventListener("click", () => {
        heading.textContent = isOriginal ? "Ben Ekrem Demir." : "Ben kimim?";
        isOriginal = !isOriginal;
      });
    </script>
  </body>
</html>
